<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="Website icon" type="png" href="Иконка конечная вектор.svg">
    <title>Крутые шахматы</title>
</head>

<body>
    <div id="main-menu" class="menu-screen">
        <h1 class="game-title">Best Chess</h1>

        <div class="menu-buttons">
            <button class="menu-btn" id="btn-online">
                Быстрый
            </button>
            <button class="menu-btn" id="btn-ranked">Рейтинговый</button>
            <button class="menu-btn" id="btn-bot">С ботом</button>
        </div>
    </div>

    <!-- Экран личного кабинета игрока -->
    <div id="cabinet-screen" class="cabinet-screen hidden">

        <h1 class="game-title">Личный кабинет</h1>


        <div class="cabinet-content">

            <!-- Блок фотографии и информации игрока -->
            <div class="cabinet-profile">

                <!-- Пока пустое место для будущей фотографии -->
                <div class="player-avatar-placeholder">
                    <img
                        src="img/profile/Profil228.jpg"
                        class="player-avatar"
                        alt="Фото игрока"
                    >
                </div>

                <!-- Информация об игроке -->
                <div class="cabinet-info">
                    <h2>Профиль игрока</h2>

                    <p>Имя игрока: <span>Игрок</span></p>
                    <p>Рейтинг: <span>1000</span></p>
                    <p>Победы: <span>0</span></p>
                    <p>Поражения: <span>0</span></p>
                </div>

            </div>

        </div>

        <!-- Кнопку оставляем без изменений -->
        <button id="btn-cabinet-back" class="menu-btn">
            Назад в меню
        </button>

        

    </div>

    <div class="container hidden" id="game-screen">
        <h1>Крутые шахматы</h1>
        <div class="board" id="board"></div>
        <div class="buttons">
            <button class="play-again">Играть снова</button>
            <button class="flip-board">Перевернуть доску</button>
            <!-- опционально -->
            <button id="btn-back">В меню</button>
        </div>
        <div id="move-history" class="move-history"></div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="stockfish-19-lite-single.js"></script>
    <script src="script.js"></script>
</body>

</html>
