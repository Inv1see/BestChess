<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="Website icon" type="png" href="Иконка конечная вектор.svg">
    <title>Крутые шахматы</title>
</head>

<body>
    <div id="main-menu" class="menu-screen">
        <h1 class="game-title">Best Chess</h1>

        <div class="menu-buttons">
            <button class="menu-btn" id="btn-online">
                Быстрый
            </button>
            <button class="menu-btn" id="btn-ranked">Рейтинговый</button>
            <button class="menu-btn" id="btn-bot">С ботом</button>
        </div>
    </div>

    <div class="container hidden" id="game-screen">
        <h1>Крутые шахматы</h1>
        <div class="board" id="board"></div>
        <div class="buttons">
            <button class="play-again">Играть снова</button>
            <button class="flip-board">Перевернуть доску</button>
            <!-- опционально -->
            <button id="btn-back">В меню</button>
        </div>
        <div id="move-history" class="move-history"></div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="stockfish-19-lite-single.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>

    <div id="link-modal" class="hidden" style="
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center;
    z-index: 10000;">
        <div style="
        background:#fff; padding:30px; border-radius:12px; max-width:500px; width:90%;
        text-align:center; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
            <h2 style="margin-bottom:15px; font-size:1.4rem;">Ссылка для друга</h2>
            <p style="margin-bottom:15px; font-size:0.95rem; color:#555;">
                Отправь эту ссылку другу — он зайдёт за чёрных.
            </p>
            <input id="share-link" type="text" readonly style="
            width:100%; padding:12px; font-size:0.9rem; border:1px solid #ccc;
            border-radius:6px; margin-bottom:15px; text-align:center;" />
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="copy-link-btn" style="
                background:#2c7454; color:#fff; padding:10px 20px;
                border-radius:6px; border:none; cursor:pointer;">Копировать</button>
                <button id="close-modal-btn" style="
                background:#888; color:#fff; padding:10px 20px;
                border-radius:6px; border:none; cursor:pointer;">Закрыть</button>
            </div>
            <p id="waiting-text" style="margin-top:15px; color:#e2a130; font-weight:600;">
                Ожидание соперника...
            </p>
        </div>
    </div>
</body>

</html>
